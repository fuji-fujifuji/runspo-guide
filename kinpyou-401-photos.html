<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>金標401 商品写真</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #f8f9fc 0%, #e8eef9 100%);
      color: #1a1a2e;
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 480px; width: 100%; }
    header {
      background: linear-gradient(135deg, #FBBC04 0%, #EA4335 100%);
      color: white;
      padding: 32px 24px;
      border-radius: 14px 14px 0 0;
      text-align: center;
    }
    header .tag {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85em;
      margin-bottom: 10px;
    }
    header h1 { font-size: 1.8em; font-weight: bold; }
    .card {
      background: white;
      padding: 28px 24px;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
    }
    .info {
      font-size: 1.05em;
      color: #444;
      margin-bottom: 22px;
    }
    .info strong { color: #EA4335; font-size: 1.15em; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #4285F4 0%, #34A853 100%);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.05em;
      box-shadow: 0 3px 10px rgba(66,133,244,0.3);
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .note {
      margin-top: 18px;
      font-size: 0.8em;
      color: #888;
    }
    @media (max-width: 600px) {
      body { padding: 12px; }
      header h1 { font-size: 1.5em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="tag">🆕 新商品</span>
      <h1>金標401</h1>
    </header>
    <div class="card">
      <p class="info">商品写真フォルダ<br><strong>9枚</strong></p>
      <a class="btn" href="https://drive.google.com/drive/folders/1bx4lYCIG6DdAZO4gUV3arLsyyyTjnPde" target="_blank" rel="noopener">📁 フォルダを開く</a>
      <p class="note">Google Drive・スマホでも見られます</p>
    </div>
  </div>
</body>
</html>
