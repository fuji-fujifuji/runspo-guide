<title>入出金場所の書き方</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f8f9fc; color: #1f2937; margin: 0; padding: 16px; line-height: 1.7; }
  main { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 20px; }
  li { margin: 4px 0; }
</style>

<body>
<main>
<h1>入出金場所の書き方</h1>
<p>帳簿はCCが書きます。人は売上報告でどう払われたかと、現金なら誰が受け取ったかを伝えるだけです。詳しくはCCに聞いてください。</p>
<h2>売上</h2>
<ul>
<li>フリマ・リベのポイント: パパさんの立替</li>
<li>Square: Squareが預かる売上金</li>
<li>代引き: ヤマトが預かる代金</li>
<li>銀行振込: 事業口座(楽天)</li>
<li>PayPay: パパさんの立替</li>
<li>現金: 受け取った人の立替</li>
</ul>
<h2>経費・仕入</h2>
<ul>
<li>メンバーが払った: その人の立替</li>
<li>事業口座・会社カードで払った: その口座・カード</li>
</ul>
</main>
</body>
