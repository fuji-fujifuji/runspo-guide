<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow,noarchive"><title>関税の払い戻し申請 進捗</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(135deg,#f8f9fc 0%,#e8eef9 100%);color:#1a1a2e;line-height:1.7;padding:16px}
.container{max-width:640px;margin:0 auto}
header{background:linear-gradient(135deg,#4285F4 0%,#34A853 100%);color:#fff;padding:24px;border-radius:14px;margin-bottom:16px;text-align:center}
header h1{font-size:1.4em}
header p{opacity:.9;font-size:.9em}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.step{display:flex;gap:12px;align-items:center;padding:8px 0}
.dot{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.done{background:#34A853}.now{background:#FBBC04}.next{background:#bbb}
.big{font-size:1.6em;font-weight:bold;color:#34A853}
footer{text-align:center;color:#888;font-size:.85em;margin-top:8px}
@media (max-width:600px){body{padding:10px}header h1{font-size:1.25em}}
</style></head><body><div class="container">
<header><h1>📦 関税の払い戻し申請</h1><p>4月の仕入れで、本来0円の関税を払っていた件</p></header>
<div class="card">
<div class="step"><div class="dot done">✓</div><div>税関から連絡（9/24・9/30）</div></div>
<div class="step"><div class="dot done">✓</div><div>証拠を送付（10/1）<br><small>仕入先とのチャット・LINEの到着報告など</small></div></div>
<div class="step"><div class="dot now">⏳</div><div><b>いまここ：税関の判断待ち</b></div></div>
<div class="step"><div class="dot next">4</div><div>OKなら申請書を出す（CCが作成）</div></div>
</div>
<div class="card" style="text-align:center">
<div>戻ってくる見込み</div><div class="big">約 13,900円</div>
<small>※税関の判断しだい。ダメでも損はなし</small>
</div>
<footer>税関から電話が来たら、聞かれた内容を担当CCに伝えてください</footer>
</div></body></html>
